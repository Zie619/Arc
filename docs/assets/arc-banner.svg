<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">ARC — Models think. The program remembers.</title>
  <desc id="desc">A violet arc connects planning, parallel agents, and verified evidence. A terminal harness for Claude and Codex.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191325"/><stop offset="1" stop-color="#0f121d"/></linearGradient>
    <linearGradient id="arc" x2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".19"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1120" height="340" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="338" rx="20" fill="none" stroke="#342b46"/>
  <ellipse cx="860" cy="170" rx="290" ry="220" fill="url(#glow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="54" y="58" font-size="12" letter-spacing="3.5" fill="#b8abc9">THE AGENT EXECUTION HARNESS</text>
    <text x="48" y="180" font-size="120" font-weight="750" letter-spacing="-5" fill="#f4f0ff">ARC<tspan fill="#a78bfa">.</tspan></text>
    <text x="54" y="228" font-size="26" fill="#e5dff1">Models think. The program remembers.</text>
    <text x="54" y="270" font-size="15" fill="#a79bb9">Claude + Codex · Git worktrees · Durable evidence</text>
  </g>
  <g fill="none" stroke="#8b5cf6" stroke-opacity=".14">
    <path d="M678 262 A186 186 0 0 1 1050 262"/><path d="M698 262 A166 166 0 0 1 1030 262"/>
    <path d="M718 262 A146 146 0 0 1 1010 262"/><path d="M738 262 A126 126 0 0 1 990 262"/>
  </g>
  <path d="M712 252 A152 152 0 0 1 1016 252" fill="none" stroke="url(#arc)" stroke-width="3"/>
  <path d="M712 252H1016" fill="none" stroke="#645071" stroke-dasharray="3 7"/>
  <g stroke-width="2"><circle cx="712" cy="252" r="8" fill="#122630" stroke="#22d3ee"/>
    <circle cx="864" cy="100" r="10" fill="#2c2048" stroke="#c4b5fd"/>
    <circle cx="1016" cy="252" r="8" fill="#302139" stroke="#f0abfc"/></g>
  <g font-family="monospace" font-size="12" text-anchor="middle" fill="#b8abc9">
    <text x="712" y="288">PLAN</text><text x="864" y="75">BUILD + REVIEW</text><text x="1016" y="288">VERIFY</text>
    <text x="864" y="221" fill="#d8c9ef" font-size="15">one durable mission</text>
  </g>
</svg>
