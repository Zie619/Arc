<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <style>
    .l { opacity: 0; animation: cyc 16s linear infinite; }
    @keyframes cyc { 0%,100% { opacity: 0; } }
    .d1 { animation-name: s1; } @keyframes s1 { 0%,2%   { opacity:0; } 5%,96%  { opacity:1; } 99%,100% { opacity:0; } }
    .d2 { animation-name: s2; } @keyframes s2 { 0%,8%   { opacity:0; } 11%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d3 { animation-name: s3; } @keyframes s3 { 0%,16%  { opacity:0; } 19%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d4 { animation-name: s4; } @keyframes s4 { 0%,26%  { opacity:0; } 29%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d5 { animation-name: s5; } @keyframes s5 { 0%,38%  { opacity:0; } 41%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d6 { animation-name: s6; } @keyframes s6 { 0%,50%  { opacity:0; } 53%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d7 { animation-name: s7; } @keyframes s7 { 0%,62%  { opacity:0; } 65%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d8 { animation-name: s8; } @keyframes s8 { 0%,74%  { opacity:0; } 77%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .d9 { animation-name: s9; } @keyframes s9 { 0%,84%  { opacity:0; } 87%,96% { opacity:1; } 99%,100% { opacity:0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .spin { animation: spinf 0.9s steps(1) infinite; }
    @keyframes spinf { 0% { opacity:1 } 50% { opacity:0.35 } 100% { opacity:1 } }
  </style>

  <!-- window -->
  <rect x="2" y="2" width="756" height="356" rx="12" fill="#0d0b16" stroke="#2a2440" stroke-width="2"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="6" fill="#febc2e"/>
  <circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text x="380" y="29" text-anchor="middle" fill="#5b5378" font-size="12">arc — your repo</text>
  <line x1="2" y1="42" x2="758" y2="42" stroke="#2a2440" stroke-width="1"/>

  <!-- session -->
  <g fill="#c9c4dd">
    <text class="l d1" x="24" y="76"><tspan fill="#8b84a8">&gt;</tspan> fix the null crash in slugify and add a test</text>
    <text class="l d2" x="24" y="104"><tspan fill="#a78bfa">⏺</tspan> reading what you typed <tspan fill="#5b5378">2s</tspan></text>
    <text class="l d3" x="24" y="132"><tspan class="spin" fill="#a78bfa">✳</tspan> making a focused change</text>
    <text class="l d3" x="42" y="156" fill="#5b5378">⎿  <tspan fill="#e879f9">Opus</tspan> predicts · <tspan fill="#22d3ee">Sol</tspan> writes · checks run · <tspan fill="#e879f9">Opus</tspan> reviews</text>
    <text class="l d4" x="42" y="184" fill="#5b5378">⎿  <tspan fill="#22d3ee">Sol</tspan> edits slug.js, slug.test.js</text>
    <text class="l d5" x="42" y="212" fill="#5b5378">⎿  test: <tspan fill="#34d399">pass</tspan> — proves: the suite does not regress</text>
    <text class="l d6" x="42" y="240" fill="#5b5378">⎿  <tspan fill="#e879f9">Opus</tspan> verdict <tspan fill="#34d399">PASS</tspan> · 1 finding check reproduced</text>
    <text class="l d7" x="24" y="272" fill="#34d399">✓ Direct change passed its checks and independent review.</text>
    <text class="l d8" x="24" y="296" fill="#8b84a8">Changed: src/slug.js, test/slug.test.js — nothing was committed.</text>
    <text class="l d9" x="24" y="330"><tspan fill="#8b84a8">&gt;</tspan> <tspan class="cursor" fill="#a78bfa">▊</tspan></text>
  </g>
</svg>
