<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M 84 120 H 214 M 214 120 H 354 M 354 120 H 494 M 494 120 H 634 M 634 120 H 796" fill="none"/>
    <path id="flowline" d="M 84 120 H 796" fill="none"/>
  </defs>

  <rect x="2" y="2" width="876" height="236" rx="14" fill="#0d0b16" stroke="#2a2440" stroke-width="2"/>

  <!-- spine -->
  <use href="#flowline" stroke="#2a2440" stroke-width="2"/>

  <!-- the pulse: one request travelling the whole machine -->
  <circle r="5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#flowline"/>
    </animateMotion>
  </circle>

  <!-- stations -->
  <g text-anchor="middle">
    <g>
      <circle cx="84" cy="120" r="26" fill="#161226" stroke="#a78bfa" stroke-width="2"/>
      <text x="84" y="124" fill="#c9c4dd">brief</text>
      <text x="84" y="170" fill="#5b5378" font-size="11">what you typed</text>
    </g>
    <g>
      <circle cx="224" cy="120" r="26" fill="#161226" stroke="#e879f9" stroke-width="2"/>
      <text x="224" y="124" fill="#c9c4dd">interview</text>
      <text x="224" y="170" fill="#5b5378" font-size="11">the head asks first</text>
    </g>
    <g>
      <circle cx="364" cy="90" r="17" fill="#161226" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="364" cy="150" r="17" fill="#161226" stroke="#e879f9" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="364" y="124" fill="#c9c4dd">scouts</text>
      <text x="364" y="190" fill="#5b5378" font-size="11">premises fact-checked</text>
    </g>
    <g>
      <circle cx="504" cy="120" r="26" fill="#161226" stroke="#a78bfa" stroke-width="2"/>
      <text x="504" y="124" fill="#c9c4dd">plan</text>
      <text x="504" y="170" fill="#5b5378" font-size="11">you approve it</text>
    </g>
    <g>
      <circle cx="644" cy="90" r="17" fill="#161226" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="644" cy="150" r="17" fill="#161226" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="644" y="124" fill="#c9c4dd">build</text>
      <text x="644" y="190" fill="#5b5378" font-size="11">isolated worktrees</text>
    </g>
    <g>
      <circle cx="796" cy="120" r="26" fill="#161226" stroke="#34d399" stroke-width="2"/>
      <text x="796" y="116" fill="#c9c4dd">review</text>
      <text x="796" y="131" fill="#c9c4dd">→ land</text>
      <text x="796" y="170" fill="#5b5378" font-size="11">evidence or it didn't happen</text>
    </g>
  </g>

  <!-- the filing cabinet under everything -->
  <g>
    <rect x="330" y="206" width="220" height="22" rx="6" fill="#161226" stroke="#4c4370" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="221" text-anchor="middle" fill="#8b84a8" font-size="11">SQLite — every decision, plan, and proof, on disk</text>
  </g>
  <text x="440" y="30" text-anchor="middle" fill="#8b84a8" font-size="12">models think · the program remembers</text>
</svg>
